<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Card frame v2 (0.10.1): art window 216×176 at (12,44), 1.5× the old 192×132; rule plate y 226–316. -->
  <defs>
    <linearGradient id="ebon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a201c"/><stop offset=".5" stop-color="#120d0b"/><stop offset="1" stop-color="#2a1a14"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d68a"/><stop offset=".5" stop-color="#b8862f"/><stop offset="1" stop-color="#6e4a17"/></linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9dcbc"/><stop offset="1" stop-color="#cbb88f"/></linearGradient>
  </defs>
  <!-- body: pointed Daedric silhouette with the art window cut out -->
  <path fill-rule="evenodd" d="M20 4 L120 0 L220 4 L236 20 L236 320 L220 336 L120 340 L20 336 L4 320 L4 20 Z M12 44 L12 220 L228 220 L228 44 Z" fill="url(#ebon)" stroke="url(#gold)" stroke-width="3"/>
  <!-- horn spikes at the corners -->
  <g fill="url(#gold)">
    <path d="M4 20 L-2 -2 L20 4 L12 12 Z"/><path d="M236 20 L242 -2 L220 4 L228 12 Z"/>
    <path d="M4 320 L-2 342 L20 336 L12 328 Z"/><path d="M236 320 L242 342 L220 336 L228 328 Z"/>
  </g>
  <!-- title band y 10-40: one line, the name centred at x 140 (the cost icon covers x < 54) -->
  <path d="M12 10 L228 10 L222 25 L228 40 L12 40 L18 25 Z" fill="#2b0f0b" stroke="url(#gold)" stroke-width="1.5"/>
  <!-- art window -->
  <path d="M12 44 L228 44 L228 220 L12 220 Z" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <path d="M12 44 L26 44 L12 58 Z M228 44 L214 44 L228 58 Z M12 220 L26 220 L12 206 Z M228 220 L214 220 L228 206 Z" fill="url(#gold)"/>
  <!-- rule plate y 226-316: up to three lines at 24 -->
  <path d="M12 226 L228 226 L228 310 L222 316 L18 316 L12 310 Z" fill="url(#parch)" stroke="#6e4a17" stroke-width="1.5"/>
  <path d="M18 231 L222 231 L222 311 L18 311 Z" fill="none" stroke="#a88b55" stroke-width=".6" stroke-dasharray="2 3"/>
  <!-- footer ornament -->
  <g fill="url(#gold)"><path d="M114 327 L120 322 L126 327 L120 332 Z"/><circle cx="102" cy="327" r="1.6"/><circle cx="138" cy="327" r="1.6"/></g>
</svg>
