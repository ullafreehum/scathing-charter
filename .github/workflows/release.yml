# Publishes a GitHub release for the version in package.json, when either
#  - a version tag (v1.2.3) is pushed, or
#  - release notes docs/releases/v<version>.md (or this workflow) are pushed on any branch
#    and that version has not been released yet (the release step creates the tag).
# It creates the release, then a Windows runner builds the desktop app (Electron, unsigned) and attaches
# the installer and the portable .exe; a separate job builds the Android debug APK and attaches it too
# (it can fail without holding up the Windows files).
name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['docs/releases/**', '.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.v.outputs.skip }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Version, notes and whether to release
        id: v
        run: |
          V="v$(node -p "require('./package.json').version")"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$V" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($V)"; exit 1; fi
          if [ ! -f "docs/releases/$V.md" ]; then echo "No docs/releases/$V.md: nothing to release."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$GITHUB_REF_TYPE" = branch ] && git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then echo "$V is already released."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: The Scathing Charter ${{ steps.v.outputs.tag }}
          body_path: docs/releases/${{ steps.v.outputs.tag }}.md
          prerelease: false # full releases since 0.10.8
  windows:
    needs: release
    if: needs.release.outputs.skip != '1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Windows app (unsigned)
        run: npm run package:win
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            release/electron/ScathingCharter-Setup-*.exe
            release/electron/ScathingCharter-Portable-*.exe
  android:
    needs: release
    if: needs.release.outputs.skip != '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk "out/ScathingCharter-$v-Android.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: out/*.apk
